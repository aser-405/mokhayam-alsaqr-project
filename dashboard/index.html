<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — مخيم الصقر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="loginScreen">
  <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="login-brand">
    <div class="login-badge"><img src="assets/logo-mark.png" alt="شعار مخيم الصقر"></div>
    <h1>مخيم الصقر</h1>
    <p>نظام إدارة وتوزيع المساعدات</p>
  </div>

  <form class="login-card" id="loginForm">
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="[email protected]" required>
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="login-btn">
      تسجيل الدخول
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="modal-note" id="loginError" style="color:var(--burgundy);"></p>
  </form>

  <div class="login-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    دخول آمن — للموظفين المصرح لهم فقط
  </div>
  <div class="login-note" style="margin-top:8px;">
    عائلة جديدة بالمخيم؟ <a href="register.html" style="color:var(--gold-deep); font-weight:700; text-decoration:none;">سجّل بياناتك من هون</a>
  </div>
  <div class="login-note" style="margin-top:4px;">
    قدّمت طلب من قبل؟ <a href="check-status.html" style="color:var(--gold-deep); font-weight:700; text-decoration:none;">تحقق من حالة تسجيلك</a>
  </div>
</section>
<script src="js/app.js"></script>
</body>
</html>
