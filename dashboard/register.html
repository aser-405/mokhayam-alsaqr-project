<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل بيانات عائلة — مخيم الصقر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .register-wrap{
    min-height:100vh; padding:50px 20px;
    background:
      radial-gradient(circle at 20% 10%, rgba(201,150,62,0.16), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(28,27,26,0.1), transparent 50%),
      var(--cream);
  }
  .register-header{display:flex; flex-direction:column; align-items:center; margin-bottom:30px; text-align:center;}
  .register-header img{width:70px; margin-bottom:14px;}
  .register-header h1{font-size:1.7rem; margin-bottom:6px;}
  .register-header p{color:var(--stone); font-size:.92rem; max-width:44ch;}
  .register-card{
    max-width:720px; margin:0 auto; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:34px;
    box-shadow:var(--shadow);
  }
  .reg-section-title{
    font-size:1.05rem; font-weight:700; margin:26px 0 14px; padding-bottom:8px;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;
  }
  .reg-section-title:first-child{margin-top:0;}
  .reg-section-title svg{width:17px; height:17px; color:var(--gold-deep);}
  .member-row{
    display:grid; grid-template-columns:1fr 110px 40px; gap:10px; align-items:center; margin-bottom:10px;
  }
  .member-row input{
    border:1px solid var(--line); border-radius:6px; padding:9px 12px;
    font-family:inherit; font-size:.9rem; background:var(--cream); color:var(--text);
  }
  .member-remove{
    width:36px; height:36px; border-radius:6px; border:1px solid var(--line);
    background:var(--cream); color:var(--burgundy); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .member-remove svg{width:15px; height:15px;}
  .add-member-btn{
    display:flex; align-items:center; gap:6px; font-size:.85rem; font-weight:700;
    color:var(--gold-deep); background:none; border:1px dashed var(--gold); border-radius:6px;
    padding:9px 14px; cursor:pointer; width:100%; justify-content:center; margin-top:4px;
  }
  .add-member-btn svg{width:15px; height:15px;}
  .register-submit{
    width:100%; padding:15px; border:none; border-radius:6px; margin-top:28px;
    background:var(--ink); color:var(--cream); font-weight:700; font-size:1rem; cursor:pointer;
  }
  .register-submit:hover{background:var(--gold-deep); color:var(--ink);}
  .register-result{text-align:center; font-weight:700; margin-top:16px; min-height:1.2em;}
  @media (max-width:560px){ .modal-row{grid-template-columns:1fr;} .member-row{grid-template-columns:1fr 80px 36px;} }
</style>
</head>
<body>

<div class="register-wrap">
  <div class="register-header">
    <img src="assets/logo-mark.png" alt="شعار مخيم الصقر">
    <h1>تسجيل بيانات عائلة جديدة</h1>
    <p>عبّي البيانات التالية بدقة، وبتتم مراجعة الطلب من إدارة المخيم قبل تفعيل العائلة رسميًا.</p>
  </div>

  <div class="register-card">
    <form id="registerForm" class="modal-form">

      <div class="reg-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        بيانات رب الأسرة
      </div>
      <div class="modal-row">
        <label>الاسم الرباعي<input type="text" id="regHeadName" required placeholder="مثال: محمد أحمد خليل العطار"></label>
        <label>رقم الهوية<input type="text" id="regHeadId" required placeholder="9XXXXXXXXX"></label>
      </div>
      <div class="modal-row">
        <label>تاريخ الميلاد<input type="date" id="regHeadBirthdate" required></label>
        <label>الحالة الاجتماعية
          <select id="regMaritalStatus"><option>أعزب</option><option selected>متزوج</option><option>مطلق</option><option>أرمل</option></select>
        </label>
      </div>
      <div class="modal-row">
        <label>رقم التواصل الأول<input type="tel" id="regPhone1" required placeholder="05XXXXXXXX"></label>
        <label>رقم التواصل الثاني (إن وجد)<input type="tel" id="regPhone2" placeholder="اختياري"></label>
      </div>
      <label>الحالة الصحية (إن وجدت ملاحظات)
        <textarea id="regHealthStatus" rows="2" placeholder="مثال: مريض سكري، إعاقة حركية... اختياري"></textarea>
      </label>
      <label>المربع/المنطقة بالمخيم (إن وجدت)
        <select id="regZone"><option value="">غير محدد</option></select>
      </label>

      <div class="reg-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        بيانات الزوجة (إن وجدت)
      </div>
      <div class="modal-row">
        <label>اسم الزوجة<input type="text" id="regSpouseName" placeholder="اختياري"></label>
        <label>رقم هوية الزوجة<input type="text" id="regSpouseId" placeholder="اختياري"></label>
      </div>

      <div class="reg-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        عدد أفراد الأسرة
      </div>
      <div class="modal-row">
        <label>عدد أفراد الأسرة (الإجمالي)<input type="number" id="regMemberCount" min="1" placeholder="مثال: 6"></label>
        <label>عدد الذكور<input type="number" id="regMaleCount" min="0" placeholder="مثال: 3"></label>
      </div>
      <label style="max-width:calc(50% - 7px);">عدد الإناث<input type="number" id="regFemaleCount" min="0" placeholder="مثال: 3"></label>

      <div class="reg-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 10h8M8 14h5"/></svg>
        أسماء أفراد الأسرة وأعمارهم
      </div>
      <div id="membersList"></div>
      <button type="button" class="add-member-btn" id="addMemberRowBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        إضافة فرد
      </button>

      <button type="submit" class="register-submit">إرسال طلب التسجيل</button>
      <p class="register-result" id="registerResult"></p>
    </form>
  </div>
  <div style="text-align:center; margin-top:20px; font-size:.85rem; color:var(--stone);">
    قدّمت طلب من قبل؟ <a href="check-status.html" style="color:var(--gold-deep); font-weight:700; text-decoration:none;">تحقق من حالة تسجيلك</a>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
